:root{--ink:#0D0F0C;--panel:#151813;--edge:#2A2E27;--edge2:#3A3F36;--volt:#C8FF2E;--white:#F2F2EE;--iron:#8A8F84;--muted:#A3A79C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--white);font-family:'SG Sans',system-ui,sans-serif}
body{min-height:100vh;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr)}
aside{border-right:1px solid var(--edge);padding:28px 24px;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:6px}
header img{height:30px;width:auto;align-self:flex-start}
h1{margin:6px 0 0;font:700 28px/1 'SG Mono';letter-spacing:-.5px}
header p{margin:0;color:var(--iron);font-size:14px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font:700 12px 'SG Mono';color:var(--iron);text-transform:uppercase;letter-spacing:.5px}
input,select,textarea{font:400 15px 'SG Sans';color:var(--white);background:var(--panel);border:1px solid var(--edge2);border-radius:4px;padding:10px 12px;width:100%}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--volt);outline-offset:1px;border-color:transparent}
#fields{display:flex;flex-direction:column;gap:16px}
#format{display:flex;gap:8px}
[hidden]{display:none !important}
#format button{flex:1}
button{font:700 14px 'SG Mono';border-radius:4px;padding:12px 14px;cursor:pointer;border:1px solid var(--edge2);background:var(--panel);color:var(--white)}
button[aria-pressed="true"]{border-color:var(--volt);color:var(--volt)}
.primary{background:var(--volt);color:var(--ink);border-color:var(--volt)}
.primary:hover{background:var(--white);border-color:var(--white)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:auto}
main{padding:32px;display:flex;align-items:center;justify-content:center;min-width:0;background-image:linear-gradient(rgba(242,242,238,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(242,242,238,.035) 1px,transparent 1px);background-size:40px 40px}
canvas{max-width:100%;max-height:calc(100vh - 64px);width:auto;height:auto;box-shadow:0 0 0 1px var(--edge2);border-radius:4px;background:var(--ink)}
footer{font-size:12px;color:#646960}
footer a{color:var(--iron)}
body:not(.ready) main::after{content:'Loading…';color:var(--iron);font:700 14px 'SG Mono'}
@media (max-width:820px){body{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--edge)}main{padding:16px}canvas{max-height:none}}
</style>
